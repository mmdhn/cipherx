<style>
/* ── tokens ── */
:root{--bg:#07050f;--card:#120c26;--in:#0b0720;--bd:#33286a;--tx:#efeaff;--dim:#9d90c9;--ac:#a855f7;--ac2:#22d3ee;--pk:#ff2e93;--ok:#34d399;--bad:#ff5470;--warn:#fbbf24;--e:cubic-bezier(.2,.8,.2,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));overflow-x:hidden}

body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.25;animation:flick 6s steps(1) infinite}
[data-theme=light] body::after{opacity:.05}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
/* ── header / glitch title ── */
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px;animation:rise .6s var(--e) both}
h1{position:relative;font:900 32px/1 var(--mono);letter-spacing:.14em;text-shadow:0 0 22px var(--ac);direction:ltr}
h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden;text-shadow:none}
h1::before{color:var(--ac2);animation:gl1 3.4s steps(1) infinite}
h1::after{color:var(--pk);animation:gl2 2.9s steps(1) infinite}
.sub{font:12px var(--mono);color:var(--dim);margin-top:6px;letter-spacing:.04em}
.sub::before{content:"> ";color:var(--ac2)}
.hb{display:flex;gap:8px}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 13px var(--mono);cursor:pointer;transition:transform .2s var(--e),border-color .2s,box-shadow .2s}

.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c2{grid-template-columns:1fr 1fr}

.fld{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:15px var(--mono);outline:none;resize:vertical;transition:border-color .25s,box-shadow .25s}

.kr{position:relative}.kr .fld{padding-inline-end:52px}
.eye{position:absolute;inset-inline-end:4px;top:2px;min-width:44px;min-height:44px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;transition:color .2s,transform .2s}
.eye:hover{color:var(--ac2)}.eye:active{transform:scale(.85)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font:12px var(--mono);color:var(--dim)}

.sec{min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--dim);font:700 13px var(--mono);cursor:pointer;transition:border-color .2s,color .2s,transform .2s}

.out{display:none;margin-top:18px;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);animation:rise .4s var(--e)}
.oh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ol{font:800 12px var(--mono);letter-spacing:.14em;color:var(--ok);text-shadow:0 0 10px currentColor}.ol.e{color:var(--bad)}

.ot{font:14px/1.8 var(--mono);word-break:break-all;user-select:all;white-space:pre-wrap}.ot.e{color:var(--bad);animation:shake .35s steps(2) 2}

footer{text-align:center;margin-top:26px;font:11px var(--mono);letter-spacing:.1em;color:var(--dim)}
#toast{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);opacity:0;transition:.3s var(--e);background:linear-gradient(135deg,var(--ac),var(--pk));color:#fff;padding:11px 22px;border-radius:30px;font:700 13px var(--mono);pointer-events:none;z-index:9;max-width:90vw;text-align:center;box-shadow:0 0 24px rgba(255,46,147,.5)}

/* ── motion ── */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes flow{to{background-position:0 0,300% 0}}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes stripe{to{background-position:32px 0}}
@keyframes shake{0%{transform:translate(0)}50%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}
@keyframes flick{0%,92%,100%{opacity:.25}93%{opacity:.5}95%{opacity:.15}}
@keyframes gl1{0%,88%,100%{clip-path:inset(0 0 100% 0);transform:none}89%{clip-path:inset(10% 0 55% 0);transform:translate(-4px,0)}92%{clip-path:inset(45% 0 25% 0);transform:translate(4px,0)}96%{clip-path:inset(75% 0 4% 0);transform:translate(-3px,0)}}
@keyframes gl2{0%,84%,100%{clip-path:inset(100% 0 0 0);transform:none}85%{clip-path:inset(60% 0 10% 0);transform:translate(4px,0)}89%{clip-path:inset(15% 0 60% 0);transform:translate(-4px,0)}93%{clip-path:inset(35% 0 40% 0);transform:translate(3px,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#bg{display:none}}
</style>

  const h=getBits(d,7,n=>n),mg=dec.decode(h.slice(0,3));

  const n=rd32(h,3);if(n<=0||n>1e6||(n+7)*8>cap)throw new Error(t('nos'));
  if(mg==='CXT'){let err;for(const sk of[key,'']){try{const{st:a0,sp}=await spread(sk,M);return await decAny(dec.decode(getBits(d,n,q=>56+((a0+q*sp)%M))),key);}catch(e){err=e;}}throw err;}
  return decAny(dec.decode(getBits(d,n,q=>56+q)),key);
}

/* ───── SAVE / SHARE (native-aware) + cache hygiene ───── */
function webDl(p){const u=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=u;a.download=p.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
const nativeArgs=async(p,nm)=>({filename:nm||p.name,contentType:p.blob.type||'application/octet-stream',base64Data:await toB64(p.blob)});
async function sweepCache(){
  if(!isNative())return;
  try{const{Filesystem}=window.Capacitor.Plugins;const l=await Filesystem.readdir({path:'',directory:'CACHE'});
    for(const f of l.files){await Filesystem.deleteFile({path:typeof f==='string'?f:f.name,directory:'CACHE'}).catch(()=>{});}}catch(e){}
}
const uniq=n=>{const d=new Date(),p=x=>String(x).padStart(2,'0'),z=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()),i=n.lastIndexOf('.');return i>0?n.slice(0,i)+'_'+z+n.slice(i):n+'_'+z;};
async function doSave(){
  if(!S.pend)return;
  try{
    if(!isNative())webDl(S.pend);
    else await window.Capacitor.Plugins.FileSharer.save({...await nativeArgs(S.pend,uniq(S.pend.name)),android:{saveDirectory:'downloads',relativePath:'Download/CipherX'}});
    toast(t('svd'));
  }catch(e){console.error(e);toast(t('sf')+': '+String((e&&e.message)||e).slice(0,80));}
}
async function doShare(){
  if(!S.pend)return;
  try{
    if(!isNative())webDl(S.pend);
    else{await window.Capacitor.Plugins.FileSharer.share(await nativeArgs(S.pend));S.lastShare=Date.now();setTimeout(sweepCache,60000);}
  }catch(e){toast(t('shf'));}
}

/* ───── FX: decode-scramble reveal + matrix background ───── */
var bgc='#07050f',_rid=0;
const GL='▓▒░█<>/\\|01#%&@';
function reveal(el,txt,err){
  const id=++_rid;
  if(err||txt.length>1500||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=txt;return;}
  const n=txt.length,T=18;let f=0;
  const step=()=>{if(id!==_rid)return;f++;const k=Math.floor(n*f/T);let o=txt.slice(0,k);
    for(let i=k;i<n;i++){const c=txt[i];o+=(c===' '||c==='\n')?c:GL[Math.random()*GL.length|0];}
    el.textContent=f<T?o:txt;if(f<T)setTimeout(step,32);};
  step();
}
function bgStart(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('bg'),x=c.getContext('2d'),G='01ABCDEF<>/|#',F=16;let w,h,d=[],last=0;
  const rs=()=>{c.width=w=innerWidth;c.height=h=innerHeight;d=Array.from({length:Math.ceil(w/F)},()=>-Math.random()*60);};
  rs();addEventListener('resize',rs);
  const loop=ts=>{requestAnimationFrame(loop);if(document.hidden||ts-last<60)return;last=ts;
    x.globalAlpha=.14;x.fillStyle=bgc;x.fillRect(0,0,w,h);x.globalAlpha=1;x.font=F+'px monospace';
    for(let i=0;i<d.length;i+=2){const y=d[i]*F;x.fillStyle=(i%4)?'#a855f7':'#22d3ee';x.fillText(G[Math.random()*G.length|0],i*F,y);d[i]=(y>h&&Math.random()>.96)?0:d[i]+1;}};
  requestAnimationFrame(loop);
}

/* ───── UI ───── */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000);}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('langB').textContent=lang==='fa'?'EN':'FA';
  refresh();onKey();onTxt();
}
function setTheme(m){document.documentElement.dataset.theme=m;setTimeout(()=>{bgc=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#07050f';},0);$('themeB').textContent=m==='dark'?'☾':'☀';$('themeB').setAttribute('aria-label','Theme: '+m);}
function refresh(){
  const e=S.mode==='enc',tb=S.tab;
  $('bEnc').classList.toggle('on',e);$('bDec').classList.toggle('on',!e);
  ['Text','File','Stego'].forEach(n=>$('tab'+n).classList.toggle('on',tb===n.toLowerCase()));
  $('algoBox').style.display=(tb!=='file')?'grid':'none';
  $('aAuto').classList.toggle('on',S.algo==='auto');$('aClassic').classList.toggle('on',S.algo==='classic');$('aPk').classList.toggle('on',S.algo==='pk');
  $('pkBox').style.display=(tb!=='file'&&S.algo==='pk')?'block':'none';$('pkRecipW').style.display=e?'block':'none';
  $('legNote').style.display=(tb!=='file'&&S.algo==='classic')?'block':'none';
  $('pnlText').style.display=(tb==='text'||(tb==='stego'&&e))?'block':'none';
  $('pnlFile').style.display=tb==='file'?'block':'none';
  $('pnlStego').style.display=tb==='stego'?'block':'none';
  $('inLbl').textContent=tb==='stego'?t('hd'):(e?t('pl'):t('ci'));
  $('fileLbl').textContent=S.file?S.file.name:t('dz');
  $('stegoLbl').textContent=S.img?S.img.name+(S.cap?'  ·  '+t('cap')+' '+Math.max(0,Math.floor((S.cap-5)*3/4)-60)+' B':''):t('di');
  if(!S.busy)$('mainBtn').textContent=e?t('en'):t('de');
  updateBtn();
}
function setMode(m){S.mode=m;S.out='';S.pend=null;$('outBox').style.display='none';refresh();}
function updateBtn(){
  const k0=$('keyInp').value.trim(),x=$('txtInp').value.trim(),k=(S.algo==='pk'&&S.mode==='enc')?$('pkRecip').value.trim():k0;let ok;
  if(S.tab==='text')ok=k&&x;else if(S.tab==='file')ok=k0&&S.file;else ok=k&&S.img&&(S.mode==='dec'||x);
  $('mainBtn').disabled=!ok||S.busy;
}
function onKey(){
  const k=$('keyInp').value;$('entBar').style.display=k?'block':'none';
  if(!k){$('entLbl').textContent='';updateBtn();return;}
  let p=0;if(/[a-z]/.test(k))p+=26;if(/[A-Z]/.test(k))p+=26;if(/\d/.test(k))p+=10;if(/[^A-Za-z0-9]/.test(k))p+=33;
  const b=Math.round(k.length*Math.log2(p||1)*0.8),lv=b<45?['w','var(--bad)']:b<70?['f','var(--warn)']:b<100?['s','var(--ac2)']:['v','var(--ok)'];
  $('entFill').style.width=Math.min(100,b)+'%';$('entFill').style.background=lv[1];
  $('entLbl').textContent=t(lv[0])+' · ~'+b+' '+t('bits');updateBtn();
}
function onTxt(){const n=$('txtInp').value.length;$('charCt').textContent=n+' / 10000 '+t('chars');updateBtn();}
function addHist(c){
  const d=new Date();hist.unshift({c,time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')});if(hist.length>4)hist.pop();
  const l=$('histList');l.textContent='';
  hist.forEach(h=>{const i=document.createElement('div');i.className='hi';i.tabIndex=0;
    i.addEventListener('click',()=>{$('txtInp').value=h.c;onTxt();});
    const a=document.createElement('span');a.textContent='ENC';const b=document.createElement('span');b.textContent=h.c.slice(0,32);b.dir='ltr';const c=document.createElement('span');c.textContent=h.time;
    i.append(a,b,c);l.appendChild(i);});
}
const prog=f=>{$('progBar').style.width=Math.round(f*100)+'%';};
async function go(){
  const key=$('keyInp').value;if(S.busy||(!key.trim()&&!(S.algo==='pk'&&S.mode==='enc'&&S.tab!=='file')))return;
  S.busy=true;S.ab={stop:false};S.pend=null;
  const isEnc=S.mode==='enc';
  $('outBox').style.display='block';$('outLbl').className='ol';$('outLbl').textContent=t('pr');$('outTxt').className='ot';$('outTxt').textContent='';
  $('saveBtn').style.display=$('shareBtn').style.display='none';
  $('mainBtn').disabled=true;$('mainBtn').textContent=t('pr');$('mainBtn').classList.add('busy');
  const fileOp=S.tab==='file';if(fileOp){$('prog').style.display='block';prog(0);$('cncBtn').style.display='';}
  let res,err=false;
  try{
    if(S.tab==='text'){const x=$('txtInp').value;res=isEnc?await encAny(x,key):await decAny(x,key);}
    else if(S.tab==='file'){const r=isEnc?await encFile(S.file,key,prog,S.ab):await decFile(S.file,key,prog,S.ab);S.pend={blob:r.blob,name:r.name};res=isEnc?t('fe'):t('fd');}
    else res=await stego(S.img,key,isEnc,$('txtInp').value);
  }catch(e){err=true;res=(e instanceof DOMException||!e.message)?t('bad'):(e.message==='cancelled'?t('cx'):e.message);}
  S.busy=false;$('mainBtn').classList.remove('busy');$('prog').style.display='none';$('cncBtn').style.display='none';
  S.out=err?'':res;
  $('outLbl').textContent=err?t('er'):(isEnc?t('oe'):t('od'));$('outLbl').className='ol'+(err?' e':'');
  $('outTxt').className='ot'+(err?' e':'');reveal($('outTxt'),res,err);
  if(!err){if(isEnc&&S.tab==='text')addHist(res);if(S.pend){$('saveBtn').style.display=$('shareBtn').style.display='';}}
  refresh();
}
function showOut(txt,label){
  $('outBox').style.display='block';$('outLbl').className='ol';$('outLbl').textContent=label;$('outTxt').className='ot';reveal($('outTxt'),txt,false);
  S.out=txt;S.pend=null;$('saveBtn').style.display=$('shareBtn').style.display='none';$('qrC').style.display='none';
}
async function pkNew(){
  const pass=$('keyInp').value;if(!pass.trim()){toast(t('pkpass'));return;}
  if(st('cx_id')&&!S.pkc){S.pkc=1;toast(t('pkrep'));setTimeout(()=>{S.pkc=0;},5000);return;}
  S.pkc=0;try{showOut(await pkGen(pass),t('pks'));}catch(e){toast(t('bad'));}
}
function pkShow(){const id=JSON.parse(st('cx_id')||'null');if(!id){toast(t('nokeys'));return;}showOut('CXPK1.'+id.pub,t('pks'));}
function doQR(){
  const c=$('qrC');if(!S.out)return;
  if(c.style.display==='block'){c.style.display='none';return;}
  if(!drawQR(S.out))toast(t('qrbig'));
}
const NP=()=>isNative()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CipherXNative;
async function openIncoming(f){
  try{const r=await fetch(window.Capacitor.convertFileSrc('file://'+f.path));const b=await r.blob();
    S.file=new File([b],f.name);S.tab='file';S.mode=/\.enc$/i.test(f.name)?'dec':'enc';S.out='';S.pend=null;$('outBox').style.display='none';refresh();toast(t('opened')+': '+f.name);}
  catch(e){toast(t('sf'));}
}
function clearAll(){
  S.ab.stop=true;$('keyInp').value='';$('txtInp').value='';$('outBox').style.display='none';
  S.out='';S.file=S.img=S.pend=null;$('fileInput').value=$('stegoInput').value='';onKey();onTxt();refresh();
}
function genKey(){$('keyInp').value=Array.from(rnd(16),b=>b.toString(16).padStart(2,'0')).join('');onKey();}
function doSwap(){if(!S.out||S.tab!=='text')return;$('txtInp').value=S.out;S.out='';onTxt();setMode(S.mode==='enc'?'dec':'enc');}

window.addEventListener('DOMContentLoaded',()=>{
  setTheme(st('cx_theme')||'dark');
  ['Text','File','Stego'].forEach(n=>$('tab'+n).addEventListener('click',()=>{S.tab=n.toLowerCase();refresh();}));
  $('bEnc').addEventListener('click',()=>setMode('enc'));$('bDec').addEventListener('click',()=>setMode('dec'));
  $('aAuto').addEventListener('click',()=>{S.algo='auto';refresh();});$('aClassic').addEventListener('click',()=>{S.algo='classic';refresh();});$('aPk').addEventListener('click',()=>{S.algo='pk';refresh();});
  $('pkRecip').addEventListener('input',updateBtn);$('pkGen').addEventListener('click',pkNew);$('pkShow').addEventListener('click',pkShow);$('qrBtn').addEventListener('click',doQR);
  $('langB').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';st('cx_lang',lang);applyLang();});
  $('themeB').addEventListener('click',()=>{const m=document.documentElement.dataset.theme==='dark'?'light':'dark';st('cx_theme',m);setTheme(m);});
  $('eyeB').addEventListener('click',()=>{S.show=!S.show;$('keyInp').type=S.show?'text':'password';$('eyeB').textContent=S.show?'◎':'◉';});
  $('genBtn').addEventListener('click',genKey);$('keyInp').addEventListener('input',onKey);$('txtInp').addEventListener('input',onTxt);
  $('mainBtn').addEventListener('click',go);$('clrBtn').addEventListener('click',clearAll);$('cncBtn').addEventListener('click',()=>{S.ab.stop=true;});
  $('swapB').addEventListener('click',doSwap);
  $('copyBtn').addEventListener('click',()=>{if(S.out&&navigator.clipboard)navigator.clipboard.writeText(S.out).then(()=>toast(t('cpd')));});
  $('saveBtn').addEventListener('click',doSave);$('shareBtn').addEventListener('click',doShare);
  $('histClr').addEventListener('click',()=>{hist.length=0;$('histList').textContent='';});
  $('fileDrop').addEventListener('click',()=>$('fileInput').click());$('stegoDrop').addEventListener('click',()=>$('stegoInput').click());
  $('fileInput').addEventListener('change',e=>{S.file=e.target.files[0]||null;refresh();});
  $('stegoInput').addEventListener('change',async e=>{S.img=e.target.files[0]||null;S.cap=0;if(S.img){try{const i=await loadImg(S.img);S.cap=Math.floor((i.width*i.height*3-56)/8);}catch(x){}}refresh();});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(!$('mainBtn').disabled)go();}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-S.lastShare>120000)sweepCache();});
  applyLang();sweepCache();bgStart();
  const np=NP();if(np){np.addListener('fileOpened',openIncoming);np.getOpenedFile().then(f=>{if(f&&f.path)openIncoming(f);}).catch(()=>{});}
});
</script>
