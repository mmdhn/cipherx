/* ───── TEXT: v2 (versioned, header authenticated) + legacy AES ───── */

const _W=`'use strict';

for(let i=half-1;i>=0;i--){const j=len-1-i;const mv=(ks[i+half]!==undefined?ks[i+half]:ks[i])%N;r[i]=((r[i]-r[j]-mv)%N+N)%N;}

self.onmessage=e=>{const{id,key,txt}=e.data;try{self.postMessage({id,result:decryptClassic(txt,key)});}catch(err){self.postMessage({id,error:err.message});}};`;

/* ───── FILES: CXv2 chunked format (1 MiB AES-GCM chunks, name encrypted, truncation-proof) ───── */
async function encFile(file,pass,prog,ab){

  const meta=JSON.parse(dec.decode(await F(0,0))),parts=[];
  for(let i=1;;i++){
    if(ab.stop)throw new Error('cancelled');
    parts.push(await F(i,1));
    prog(Math.min(1,pos/file.size));
    if(pos>=file.size)break;
  }
  return fixName({blob:new Blob(parts,{type:'application/octet-stream'}),name:String(meta.n||'decrypted.bin')});
}
const fixName=r=>{r.name=r.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/^\.+/,'')||'decrypted.bin';return r;};

/* ───── STEGO (LSB, RGB only; carrier flattened to opaque so alpha can't corrupt bits) ───── */
const px=s=>((s/3)|0)*4+s%3;
function putBits(d,bytes,s0){let s=s0;for(const by of bytes)for(let k=7;k>=0;k--,s++)d[px(s)]=(d[px(s)]&254)|((by>>k)&1);}
function getBits(d,n,s0){const o=new Uint8Array(n);let s=s0;for(let i=0;i<n;i++){let v=0;for(let k=0;k<8;k++,s++)v=(v<<1)|(d[px(s)]&1);o[i]=v;}return o;}
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i);};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error(t('bad')));};i.src=u;});
async function stego(f,key,isEnc,txt){
  const img=await loadImg(f),c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data,cap=c.width*c.height*3;
  if(isEnc){
    const eb=enc.encode(await encText(txt,key)),p=cat(enc.encode('CXS'),u32(eb.length),eb);
    if(p.length*8>cap)throw new Error(t('small'));
    putBits(d,p,0);x.putImageData(im,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    S.pend={blob,name:'stego_cipherx.png'};return t('sd');
  }
  const h=getBits(d,7,0);
  if(dec.decode(h.slice(0,3))!=='CXS')throw new Error(t('nos'));
  const n=rd32(h,3);if(n<=0||n>1e6||(n+7)*8>cap)throw new Error(t('nos'));
  return decAny(dec.decode(getBits(d,n,56)),key);
}

/* ───── SAVE / SHARE (native-aware) + cache hygiene ───── */
function webDl(p){const u=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=u;a.download=p.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
const nativeArgs=async p=>({filename:p.name,contentType:p.blob.type||'application/octet-stream',base64Data:await toB64(p.blob)});
async function sweepCache(){
  if(!isNative())return;
  try{const{Filesystem}=window.Capacitor.Plugins;const l=await Filesystem.readdir({path:'',directory:'CACHE'});
    for(const f of l.files){await Filesystem.deleteFile({path:typeof f==='string'?f:f.name,directory:'CACHE'}).catch(()=>{});}}catch(e){}
}
async function doSave(){
  if(!S.pend)return;
  try{
    if(!isNative())webDl(S.pend);
    else await window.Capacitor.Plugins.FileSharer.save({...await nativeArgs(S.pend),android:{saveDirectory:'downloads',relativePath:'Download/CipherX'}});
    toast(t('svd'));
  }catch(e){toast(t('sf'));}
}
async function doShare(){
  if(!S.pend)return;
  try{
    if(!isNative())webDl(S.pend);
    else{await window.Capacitor.Plugins.FileSharer.share(await nativeArgs(S.pend));S.lastShare=Date.now();setTimeout(sweepCache,60000);}
  }catch(e){toast(t('shf'));}
}

/* ───── UI ───── */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000);}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('langB').textContent=lang==='fa'?'EN':'FA';
  refresh();onKey();onTxt();
}
function setTheme(m){document.documentElement.dataset.theme=m;$('themeB').textContent=m==='dark'?'☾':'☀';$('themeB').setAttribute('aria-label','Theme: '+m);}
function refresh(){
  const e=S.mode==='enc',tb=S.tab;
  $('bEnc').classList.toggle('on',e);$('bDec').classList.toggle('on',!e);
  ['Text','File','Stego'].forEach(n=>$('tab'+n).classList.toggle('on',tb===n.toLowerCase()));
  $('algoBox').style.display=(!e&&tb!=='file')?'grid':'none';
  $('aAuto').classList.toggle('on',S.algo==='auto');$('aClassic').classList.toggle('on',S.algo==='classic');
  $('legNote').style.display=(!e&&tb!=='file'&&S.algo==='classic')?'block':'none';
  $('pnlText').style.display=(tb==='text'||(tb==='stego'&&e))?'block':'none';
  $('pnlFile').style.display=tb==='file'?'block':'none';
  $('pnlStego').style.display=tb==='stego'?'block':'none';
  $('inLbl').textContent=tb==='stego'?t('hd'):(e?t('pl'):t('ci'));
  $('fileLbl').textContent=S.file?S.file.name:t('dz');
  $('stegoLbl').textContent=S.img?S.img.name:t('di');
  if(!S.busy)$('mainBtn').textContent=e?t('en'):t('de');
  updateBtn();
}
function setMode(m){S.mode=m;S.out='';S.pend=null;$('outBox').style.display='none';refresh();}
function updateBtn(){
  const k=$('keyInp').value.trim(),x=$('txtInp').value.trim();let ok;
  if(S.tab==='text')ok=k&&x;else if(S.tab==='file')ok=k&&S.file;else ok=k&&S.img&&(S.mode==='dec'||x);
  $('mainBtn').disabled=!ok||S.busy;
}
function onKey(){
  const k=$('keyInp').value;$('entBar').style.display=k?'block':'none';
  if(!k){$('entLbl').textContent='';updateBtn();return;}
  let p=0;if(/[a-z]/.test(k))p+=26;if(/[A-Z]/.test(k))p+=26;if(/\d/.test(k))p+=10;if(/[^A-Za-z0-9]/.test(k))p+=33;
  const b=Math.round(k.length*Math.log2(p||1)*0.8),lv=b<45?['w','var(--bad)']:b<70?['f','var(--warn)']:b<100?['s','var(--ac2)']:['v','var(--ok)'];
  $('entFill').style.width=Math.min(100,b)+'%';$('entFill').style.background=lv[1];
  $('entLbl').textContent=t(lv[0])+' · ~'+b+' '+t('bits');updateBtn();
}
function onTxt(){const n=$('txtInp').value.length;$('charCt').textContent=n+' / 10000 '+t('chars');updateBtn();}
function addHist(c){
  const d=new Date();hist.unshift({c,time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')});if(hist.length>4)hist.pop();
  const l=$('histList');l.textContent='';
  hist.forEach(h=>{const i=document.createElement('div');i.className='hi';i.tabIndex=0;
    i.addEventListener('click',()=>{$('txtInp').value=h.c;onTxt();});
    const a=document.createElement('span');a.textContent='ENC';const b=document.createElement('span');b.textContent=h.c.slice(0,32);b.dir='ltr';const c=document.createElement('span');c.textContent=h.time;
    i.append(a,b,c);l.appendChild(i);});
}
const prog=f=>{$('progBar').style.width=Math.round(f*100)+'%';};
async function go(){
  const key=$('keyInp').value;if(!key.trim()||S.busy)return;
  S.busy=true;S.ab={stop:false};S.pend=null;
  const isEnc=S.mode==='enc';
  $('outBox').style.display='block';$('outLbl').className='ol';$('outLbl').textContent=t('pr');$('outTxt').className='ot';$('outTxt').textContent='';
  $('saveBtn').style.display=$('shareBtn').style.display='none';
  $('mainBtn').disabled=true;$('mainBtn').textContent=t('pr');
  const fileOp=S.tab==='file';if(fileOp){$('prog').style.display='block';prog(0);$('cncBtn').style.display='';}
  let res,err=false;
  try{
    if(S.tab==='text'){const x=$('txtInp').value;res=isEnc?await encText(x,key):await decAny(x,key);}
    else if(S.tab==='file'){const r=isEnc?await encFile(S.file,key,prog,S.ab):await decFile(S.file,key,prog,S.ab);S.pend={blob:r.blob,name:r.name};res=isEnc?t('fe'):t('fd');}
    else res=await stego(S.img,key,isEnc,$('txtInp').value);
  }catch(e){err=true;res=(e instanceof DOMException||!e.message)?t('bad'):(e.message==='cancelled'?t('cx'):e.message);}
  S.busy=false;$('prog').style.display='none';$('cncBtn').style.display='none';
  S.out=err?'':res;
  $('outLbl').textContent=err?t('er'):(isEnc?t('oe'):t('od'));$('outLbl').className='ol'+(err?' e':'');
  $('outTxt').className='ot'+(err?' e':'');$('outTxt').textContent=res;
  if(!err){if(isEnc&&S.tab==='text')addHist(res);if(S.pend){$('saveBtn').style.display=$('shareBtn').style.display='';}}
  refresh();
}
function clearAll(){
  S.ab.stop=true;$('keyInp').value='';$('txtInp').value='';$('outBox').style.display='none';
  S.out='';S.file=S.img=S.pend=null;$('fileInput').value=$('stegoInput').value='';onKey();onTxt();refresh();
}
function genKey(){$('keyInp').value=Array.from(rnd(16),b=>b.toString(16).padStart(2,'0')).join('');onKey();}
function doSwap(){if(!S.out||S.tab!=='text')return;$('txtInp').value=S.out;S.out='';onTxt();setMode(S.mode==='enc'?'dec':'enc');}

window.addEventListener('DOMContentLoaded',()=>{
  setTheme(st('cx_theme')||(matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  ['Text','File','Stego'].forEach(n=>$('tab'+n).addEventListener('click',()=>{S.tab=n.toLowerCase();refresh();}));
  $('bEnc').addEventListener('click',()=>setMode('enc'));$('bDec').addEventListener('click',()=>setMode('dec'));
  $('aAuto').addEventListener('click',()=>{S.algo='auto';refresh();});$('aClassic').addEventListener('click',()=>{S.algo='classic';refresh();});
  $('langB').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';st('cx_lang',lang);applyLang();});
  $('themeB').addEventListener('click',()=>{const m=document.documentElement.dataset.theme==='dark'?'light':'dark';st('cx_theme',m);setTheme(m);});
  $('eyeB').addEventListener('click',()=>{S.show=!S.show;$('keyInp').type=S.show?'text':'password';$('eyeB').textContent=S.show?'◎':'◉';});
  $('genBtn').addEventListener('click',genKey);$('keyInp').addEventListener('input',onKey);$('txtInp').addEventListener('input',onTxt);
  $('mainBtn').addEventListener('click',go);$('clrBtn').addEventListener('click',clearAll);$('cncBtn').addEventListener('click',()=>{S.ab.stop=true;});
  $('swapB').addEventListener('click',doSwap);
  $('copyBtn').addEventListener('click',()=>{if(S.out&&navigator.clipboard)navigator.clipboard.writeText(S.out).then(()=>toast(t('cpd')));});
  $('saveBtn').addEventListener('click',doSave);$('shareBtn').addEventListener('click',doShare);
  $('histClr').addEventListener('click',()=>{hist.length=0;$('histList').textContent='';});
  $('fileDrop').addEventListener('click',()=>$('fileInput').click());$('stegoDrop').addEventListener('click',()=>$('stegoInput').click());
  $('fileInput').addEventListener('change',e=>{S.file=e.target.files[0]||null;refresh();});
  $('stegoInput').addEventListener('change',e=>{S.img=e.target.files[0]||null;refresh();});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(!$('mainBtn').disabled)go();}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-S.lastShare>120000)sweepCache();});
  applyLang();sweepCache();
});
</script>
