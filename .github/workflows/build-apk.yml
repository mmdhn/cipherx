name: Build CIPHERX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK via Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp favicon.png www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init CIPHERX com.cipherx.app --web-dir www
          npx cap add android
          
          # رفع تداخل کلاس‌های تکراری کوتلین در گرادل
          echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle

          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # آپلود به عنوان فایل Release مستقیماً در صفحه اصلی گیت‌هاب
      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: CIPHERX Release v1.0.${{ github.run_number }}
          body: |
            ✦ برنامه CIPHERX آماده نصب شد.
            - خروجی مستقیم فایل APK اندروید
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
