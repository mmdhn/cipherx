name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate random password
        id: pass
        run: |
          PASS=$(openssl rand -base64 18)
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Create keystore
        env:
          PASS: ${{ steps.pass.outputs.pass }}
        run: |
          keytool -genkey -v -keystore cipherx.keystore -alias cipherx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=CIPHERX, OU=App, O=CIPHERX, L=City, S=State, C=US"

      - name: Set repository secrets automatically
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PASS: ${{ steps.pass.outputs.pass }}
        run: |
          KEYSTORE_B64=$(base64 -w 0 cipherx.keystore)
          gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}" --body "$KEYSTORE_B64"
          gh secret set KEYSTORE_PASSWORD --repo "${{ github.repository }}" --body "$PASS"
          gh secret set KEY_ALIAS --repo "${{ github.repository }}" --body "cipherx"
          gh secret set KEY_PASSWORD --repo "${{ github.repository }}" --body "$PASS"
          echo "چهار تا secret با موفقیت و با پسورد یکسان (سازگار با PKCS12) ثبت شدن."
