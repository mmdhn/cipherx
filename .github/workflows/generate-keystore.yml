name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate random passwords
        id: pass
        run: |
          KS_PASS=$(openssl rand -base64 18)
          KEY_PASS=$(openssl rand -base64 18)
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "ks_pass=$KS_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Create keystore
        env:
          KS_PASS: ${{ steps.pass.outputs.ks_pass }}
          KEY_PASS: ${{ steps.pass.outputs.key_pass }}
        run: |
          keytool -genkey -v -keystore cipherx.keystore -alias cipherx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=CIPHERX, OU=App, O=CIPHERX, L=City, S=State, C=US"

      - name: Package output
        env:
          KS_PASS: ${{ steps.pass.outputs.ks_pass }}
          KEY_PASS: ${{ steps.pass.outputs.key_pass }}
        run: |
          mkdir -p out
          base64 -w 0 cipherx.keystore > out/keystore.b64
          cat > out/credentials.txt << EOF
          KEYSTORE_PASSWORD=$KS_PASS
          KEY_ALIAS=cipherx
          KEY_PASSWORD=$KEY_PASS
          EOF

      - name: Upload keystore package
        uses: actions/upload-artifact@v6
        with:
          name: keystore-package
          path: out/
