name: Build CIPHERX APK

on:
  workflow_dispatch:
    inputs:
      native_plugin:
        description: 'Native Kotlin plugin (open .enc from other apps). Untick if the build fails'
        type: boolean
        default: true
      version:
        description: 'شماره نسخه (اختیاری - مثلاً 1.0.7 یا 2 یا 3.5 - خالی بذاری خودکار محاسبه می‌شه)'
        required: false
        default: ''
      release_notes:
        description: 'توضیحات این نسخه (اختیاری - خالی بذاری از پیام commit استفاده می‌شه)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android project via Capacitor
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          mkdir -p www
          cp index.html www/
          cp favicon.png www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          # favicon داخل APK لازم نیست ۱.۷ مگابایت باشه (آیکون اصلی جدا از assets/icon.png ساخته می‌شه)
          (convert favicon.png -resize 256x256 www/favicon.png 2>/dev/null || magick favicon.png -resize 256x256 www/favicon.png 2>/dev/null) || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capgo/capacitor-file-sharer
          npx cap init CIPHERX com.cipherx.app --web-dir www
          npx cap add android

          # ── جلوگیری از backup خودکار دیتای اپ ──
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml

          # ── تعیین شماره‌ی نسخه: دستی (اگه وارد شده) یا خودکار ──
          if [ -n "$VERSION_INPUT" ]; then
            APP_VERSION="$VERSION_INPUT"
          else
            APP_VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # ── versionCode همیشه خودکار و صعودیه (برای تشخیص آپدیت توسط اندروید) ──
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle

          cat >> android/build.gradle << 'EOF'
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          # ── ساخت آیکون واقعی اندروید از روی favicon.png ──
          mkdir -p assets
          cp favicon.png assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

          npx cap sync

      - name: Apply native Kotlin plugin
        if: ${{ inputs.native_plugin }}
        run: |
          set -e
          D=android/app/src/main/java/com/cipherx/app
          test -d "$D"
          cp native/CipherXNativePlugin.kt "$D/CipherXNativePlugin.kt"
          cp native/MainActivity.java "$D/MainActivity.java"
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          sed -i "/classpath 'com.android.tools.build:gradle/a\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'" android/build.gradle
          sed -i "0,/apply plugin: 'com.android.application'/s//apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle
          grep -q "kotlin-gradle-plugin" android/build.gradle || { echo "::error::kotlin classpath was not added"; exit 1; }
          grep -q "kotlin-android" android/app/build.gradle || { echo "::error::kotlin-android was not applied"; exit 1; }
          cat >> android/app/build.gradle << 'EOF'
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(android.compileOptions.targetCompatibility.toString()) }
          }
          EOF

      - name: Add Argon2 (BouncyCastle) dependency
        if: ${{ inputs.native_plugin }}
        run: |
          cat >> android/app/build.gradle << 'EOF'
          dependencies {
              implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
          }
          EOF

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cipherx.keystore

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("cipherx.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/; s/-all\.zip/-bin.zip/' $P
          cat $P
          for i in 1 2 3 4; do ./gradlew assembleRelease && exit 0; echo "retry $i"; sleep 30; done; exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CIPHERX v${{ env.APP_VERSION }}
          body: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'به‌روزرسانی جدید' }}
          files: android/app/build/outputs/apk/release/app-release.apk
