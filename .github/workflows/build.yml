name: Build CIPHERX APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره نسخه (اختیاری - مثلاً 1.0.7 یا 2 یا 3.5 - خالی بذاری خودکار محاسبه می‌شه)'
        required: false
        default: ''
      release_notes:
        description: 'توضیحات این نسخه (اختیاری - خالی بذاری از پیام commit استفاده می‌شه)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android project via Capacitor
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          mkdir -p www
          cp index.html www/
          cp favicon.png www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capgo/capacitor-file-sharer
          npx cap init CIPHERX com.cipherx.app --web-dir www
          npx cap add android

          # ── تعیین شماره‌ی نسخه: دستی (اگه وارد شده) یا خودکار ──
          if [ -n "$VERSION_INPUT" ]; then
            APP_VERSION="$VERSION_INPUT"
          else
            APP_VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # ── versionCode همیشه خودکار و صعودیه (برای تشخیص آپدیت توسط اندروید) ──
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle

          cat >> android/build.gradle << 'EOF'
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          # ── ساخت آیکون واقعی اندروید از روی favicon.png ──
          mkdir -p assets
          cp favicon.png assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

          npx cap sync

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cipherx.keystore

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("cipherx.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CIPHERX v${{ env.APP_VERSION }}
          body: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'به‌روزرسانی جدید' }}
          files: android/app/build/outputs/apk/release/app-release.apk
